name: Build and Deploy

on:
  push:
    branches: [main]

# Cancela execuções antigas se um novo push chegar — garante deploy único
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      # Dispara o deploy da Hostinger via webhook SOMENTE se o secret existir.
      # Se não houver webhook, a Hostinger puxa do Git automaticamente (deploy nativo)
      # e este passo é ignorado sem quebrar o workflow.
      - name: Trigger Hostinger deployment (opcional)
        if: ${{ success() && secrets.HOSTINGER_WEBHOOK_URL != '' }}
        run: curl -fsS -X POST "${HOSTINGER_WEBHOOK_URL}"
        env:
          HOSTINGER_WEBHOOK_URL: ${{ secrets.HOSTINGER_WEBHOOK_URL }}

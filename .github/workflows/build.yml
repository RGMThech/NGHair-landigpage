name: Build and Deploy

on:
  push:
    branches: [main]

# Cancela execuções antigas se um novo push chegar — garante deploy único
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      # A Hostinger faz o deploy automaticamente puxando do GitHub (deploy nativo
      # configurado no painel da Hostinger). Não há passo de webhook aqui — o build
      # apenas valida e gera os artefatos. Os arquivos public/ já vão no commit.

name: Sync Prestacao de Contas Public HTML

on:
  push:
    branches: [main]
    paths:
      - 'NGHairBrooklin_prestacaocontas/prestacao-contas-nghair-brooklin.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-public-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate public HTML files
        run: python3 scripts/sync-nghair-prestacao.py

      - name: Commit generated public files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Sync NGHair Prestacao de Contas public HTML'
          file_pattern: 'public/NGHairBrooklin_prestacaocontas.html public/NGHairBrooklin_prestacaocontas/index.html public/NGHairBrooklin_prestacaocontas/assets/*'
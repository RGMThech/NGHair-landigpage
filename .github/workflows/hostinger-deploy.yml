name: Deploy Hostinger - Prestacao de Contas

on:
  push:
    branches: [main]
    paths:
      - 'NGHairBrooklin_prestacaocontas/**'
      - 'public/NGHairBrooklin_prestacaocontas/**'
      - 'public/NGHairBrooklin_prestacaocontas.html'

jobs:
  deploy-hostinger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hostinger Git deployment
        run: |
          test -n "${HOSTINGER_WEBHOOK_URL}"
          curl -fsS -X POST "${HOSTINGER_WEBHOOK_URL}"
        env:
          HOSTINGER_WEBHOOK_URL: ${{ secrets.HOSTINGER_WEBHOOK_URL }}